name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-native-v1]
    paths:
      - "payam-negar-android-v1-source-autolock-1.zip"
      - ".github/workflows/android-apk.yml"
      - "android/**"

permissions:
  contents: write

jobs:
  extract-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: android-native-v1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract clean Android source into android/
        run: |
          set -euo pipefail
          ARCHIVE="payam-negar-android-v1-source-autolock-1.zip"
          test -f "$ARCHIVE"
          rm -rf /tmp/payam-negar-extract
          mkdir -p /tmp/payam-negar-extract android
          unzip -q "$ARCHIVE" -d /tmp/payam-negar-extract
          SOURCE="/tmp/payam-negar-extract/payam-negar-android-v1"
          test -f "$SOURCE/settings.gradle"
          find android -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          rsync -a --exclude='build/' --exclude='*.class' --exclude='android-javac-errors.txt' "$SOURCE/" android/
          rm -rf android/build android/app/build
          find android -type f -name '*.class' -delete
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/tools/run-pure-tests.sh
          rm "$ARCHIVE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android "$ARCHIVE"
          git commit -m "Add clean native Android source" || echo "No source changes to commit"
          git push origin android-native-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run cryptography interoperability tests
        working-directory: android
        run: bash tools/run-pure-tests.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: payam-negar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
