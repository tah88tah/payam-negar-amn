name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, e.g. android-v1.0.0"
        required: false
        type: string
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run cryptography interoperability tests
        working-directory: android
        run: tools/run-pure-tests.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: payam-negar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Payam Negar Android ${{ inputs.release_tag }}
          body: |
            Debug-signed test APK. Install only for testing.
            This build is not a production-signed release.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
